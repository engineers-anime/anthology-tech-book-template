name: Clean up ebook PDF artifacts

on:
  workflow_dispatch:
    inputs:
      cutoff_datetime:
        description: 'Cutoff in Japan time (YYYY-MM-DD HH:MM). Required for deletion. Blank previews all existing matches.'
        required: false
        type: string
      delete_artifacts:
        description: 'Permanently delete matching artifacts (off: preview only)'
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-pdf-artifacts

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Find and optionally delete old ebook PDFs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CUTOFF_DATETIME: ${{ inputs.cutoff_datetime }}
          DELETE_ARTIFACTS: ${{ inputs.delete_artifacts }}
        run: python3 scripts/cleanup-pdf-artifacts.py
